# CortenDesk + MySQL. One image: console, ID server and relay.
#
# Set APP_URL to the address your clients and browsers reach — everything else
# is derived from it, including what hbbs tells clients about the relay. Leave
# it as localhost and sessions that need the relay will hang.
#
# For a zero-dependency trial the image also runs standalone on SQLite:
#   docker run -p 8080:8080 -p 21115-21119:21115-21119 -p 21116:21116/udp \
#     -e APP_URL=http://your-host:8080 -v cortendesk-data:/data \
#     ghcr.io/marcpope/cortendesk:latest
services:
  cortendesk:
    image: ghcr.io/marcpope/cortendesk:latest
    ports:
      - "8080:8080"
      - "21115-21119:21115-21119/tcp"
      - "21116:21116/udp"
    environment:
      APP_URL: http://192.168.0.171:8080
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/cortendesk.sqlite
      CORTENDESK_EMBEDDED_SERVER: "true"
      CORTENDESK_ID_SERVER: 192.168.0.171:21116
      CORTENDESK_RELAY_SERVER: 192.168.0.171:21117
      RUSTDESK_RELAY_ADVERTISED: 192.168.0.171:21117
      CORTENDESK_PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINfs7vX+EIGbmC47UJs/woW7ObYCqNSCcEzqJCdqNDlC cortendesk-server"
      CORTENDESK_NATIVE_WEBCLIENT: "true"
      CORTENDESK_WS_ID_URL: ""
      CORTENDESK_WS_RELAY_URL: ""
    volumes:
      - cortendesk-data:/data
      - ./config/rustdesk-server.conf:/etc/cortendesk/rustdesk-server.conf:ro
    restart: unless-stopped

volumes:
  cortendesk-data:
