# The ID server and relay, run alongside the console.
#
# hbbs: -r = relay servers to advertise, -R = rendezvous servers to advertise.
# Without -R, hbbs falls back to advertising rustdesk.com in ConfigUpdate messages.

[program:hbbs]
command=hbbs -r %(ENV_RUSTDESK_RELAY_ADVERTISED)s -R %(ENV_CORTENDESK_ID_SERVER)s -k _
directory=/data/rustdesk
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true

[program:hbbr]
command=hbbr -k _
directory=/data/rustdesk
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
